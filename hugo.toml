  OPynSim is developed by the <a href="https://www.tudelft.nl/3me/over/afdelingen/biomechanical-engineering">Biomechanical Engineering</a> department at <a href="https://www.tudelft.nl/">TU Delft</a>. It is funded through 2026-2028 by <a href="https://www.openscience.nl/">Open Science NL</a> through its "Open Science Infrastructure" grant call (<a href="https://doi.org/10.61686/KYYRQ22856">NWO project page</a>, <a href="https://www.openscience.nl/en/news/45-projects-strengthen-dutch-open-science-infrastructure">announcement</a>). You can read the project's proposal on <a href="https://doi.org/10.5281/zenodo.19493285">Zenodo</a>.
'''

  [[params.sponsors]]
